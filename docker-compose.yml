services:
  # ============================================================================
  # PostgreSQL Database (Audit logging and API key store)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gateway
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis (Distributed sliding-window rate limiting)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Production LLM API Gateway
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      APP_ENV: production
      PORT: ${PORT:-8080}
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: "60"
      RATE_LIMIT_REDIS_FAILURE_POLICY: fail_open
      WEBHOOK_SECRET: change-this-secret-to-a-secure-random-string-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: INFO
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8080} --workers 2"

volumes:
  postgres_data:
  redis_data:
