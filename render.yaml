services:
  - type: web
    name: production-llm-api-gateway
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080} --workers 2"
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: RATE_LIMIT_REDIS_FAILURE_POLICY
        value: fail_open
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gateway-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: gateway-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: gateway-postgres
    plan: free
    region: oregon
    databaseName: gateway
    user: gateway_user
